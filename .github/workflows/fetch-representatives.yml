# .github/workflows/fetch-representatives.yml
#
# 觸發時機：
#   1. 自動執行：每日早上六點
#   2. 在 GitHub Actions 頁面手動按下 "Run workflow" 按鈕
#   3. 透過 GitHub API 觸發：搭配 legislative-hub 後台使用

name: 同步學生代表名冊

permissions:
  contents: write

on:
  # 自動執行：每天 UTC 22:00 (UTC+8 06:00)
  schedule:
    - cron: "0 22 * * *"
  # 手動觸發 1：GitHub Web UI
  workflow_dispatch:
    inputs:
      reason:
        description: "觸發原因（選填，僅供紀錄）"
        required: false
        default: ""
  # 手動觸發 2：GitHub API
  repository_dispatch:
    types: [refresh-representatives]

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出儲存庫
        uses: actions/checkout@v7

      - name: 安裝 pnpm
        uses: pnpm/action-setup@v6

      - name: 設定 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: 安裝依賴套件
        run: pnpm install papaparse

      - name: 讀取並處理試算表資料
        run: node scripts/fetchRepresentatives.mjs

      - name: 檢查是否有變更
        id: check_changes
        run: |
          git diff --quiet data/representatives.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: 判斷觸發原因
        id: reason
        # 外部輸入一律經由 env 傳入，不直接以 GitHub 運算式展開於 shell 中，避免指令注入
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REASON: ${{ github.event.inputs.reason }}
          TRIGGERED_BY: ${{ github.event.client_payload.triggered_by }}
          TRIGGERED_BY_SITE: ${{ github.event.client_payload.triggered_by_site }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            MSG="每日自動執行"
          elif [ "$EVENT_NAME" = "repository_dispatch" ]; then
            # triggered_by 由網站後台帶入，內容為登入單位簡稱或「管理員（暱稱）」
            if [ -n "$TRIGGERED_BY" ]; then
              MSG="由「${TRIGGERED_BY}」透過「${TRIGGERED_BY_SITE:-未知網站}」的 API 觸發"
            else
              MSG="透過 API 觸發（未註明觸發者）"
            fi
          elif [ -n "$INPUT_REASON" ]; then
            MSG="使用者從介面手動更新，事由：「${INPUT_REASON}」"
          else
            MSG="使用者從介面手動更新"
          fi
          # 去除換行，避免破壞 GITHUB_OUTPUT 的格式
          MSG=$(printf '%s' "$MSG" | tr -d '\r\n')
          printf 'msg=%s\n' "$MSG" >> "$GITHUB_OUTPUT"

      - name: 提交並推送變更
        if: steps.check_changes.outputs.changed == 'true'
        env:
          REASON_MSG: ${{ steps.reason.outputs.msg }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/representatives.json
          git commit -m "data(reps): 從 Google Sheets 同步學生代表資料" -m "觸發原因：${REASON_MSG}"
          git push
