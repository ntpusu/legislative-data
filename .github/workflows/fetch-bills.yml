# .github/workflows/fetch-bills.yml
#
# 觸發時機：
#   1. 自動執行：每天早上凌晨二時
#   2. 在 GitHub Actions 頁面手動按下 "Run workflow" 按鈕
#   3. 網站後台透過 GitHub API 觸發（repository_dispatch，event type: refresh-bills）

name: 同步議案資料

permissions:
  contents: write

on:
  schedule:
    # 每天 18:00 (UTC) 執行，對應台灣時間早上 02:00
    - cron: "0 18 * * *"
  workflow_dispatch: # 允許從介面手動觸發
    inputs:
      reason:
        description: "觸發原因（選填，僅供紀錄）"
        required: false
        default: ""

  repository_dispatch: # 允許透過 GitHub API 從網站後台觸發
    types: [refresh-bills]

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Fetch and parse Google Sheets data
        env:
          BILLS_SHEET_ID: ${{ secrets.BILLS_SHEET_ID }}
          BILLS_SHEET_GID: ${{ secrets.BILLS_SHEET_GID }}
        run: node scripts/fetchBills.mjs

      - name: 判斷觸發原因
        id: reason
        # 外部輸入一律經由 env 傳入，不直接以 GitHub 運算式展開於 shell 中，避免指令注入
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REASON: ${{ github.event.inputs.reason }}
          TRIGGERED_BY: ${{ github.event.client_payload.triggered_by }}
          TRIGGERED_BY_SITE: ${{ github.event.client_payload.triggered_by_site }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            MSG="每日自動執行"
          elif [ "$EVENT_NAME" = "repository_dispatch" ]; then
            # triggered_by 由網站後台帶入，內容為登入單位簡稱或「管理員（暱稱）」
            if [ -n "$TRIGGERED_BY" ]; then
              MSG="由「${TRIGGERED_BY}」透過「${TRIGGERED_BY_SITE:-未知網站}」的 API 觸發"
            else
              MSG="透過 API 觸發（未註明觸發者）"
            fi
          elif [ -n "$INPUT_REASON" ]; then
            MSG="使用者從介面手動更新，事由：「${INPUT_REASON}」"
          else
            MSG="使用者從介面手動更新"
          fi
          # 去除換行，避免破壞 GITHUB_OUTPUT 的格式
          MSG=$(printf '%s' "$MSG" | tr -d '\r\n')
          printf 'msg=%s\n' "$MSG" >> "$GITHUB_OUTPUT"

      - name: Check for changes and Commit
        id: auto-commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            data(bills): 從 Google Sheets 同步議案資料

            觸發原因：${{ steps.reason.outputs.msg }}
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          file_pattern: "data/*.json"

      - name: 清除 jsDelivr 快取
        if: steps.auto-commit.outputs.changes_detected == 'true'
        run: |
          curl https://purge.jsdelivr.net/gh/ntpusu/legislative-data@main/data/bill_latestTerm.json
          curl https://purge.jsdelivr.net/gh/ntpusu/legislative-data@main/data/bill_pastTerms.json
