# .github/workflows/fetch-committee-reports.yml
#
# 觸發時機：
#   1. 自動執行：每週一凌晨三點半
#   2. 在 GitHub Actions 頁面手動按下 "Run workflow" 按鈕
#   3. 網站後台透過 GitHub API 觸發（repository_dispatch，event type: refresh-committee-reports）

name: 同步委員會報告資料

permissions:
  contents: write

on:
  workflow_dispatch: # 允許在 GitHub web UI 手動觸發
    inputs:
      reason:
        description: '觸發原因（選填，僅供紀錄）'
        required: false
        default: ''

  repository_dispatch:     # 允許透過 GitHub API 從網站後台觸發
    types: [refresh-committee-reports]

jobs:
  fetch-and-commit:
    name: Fetch from Google Sheets and commit JSON
    runs-on: ubuntu-latest

    permissions:
      contents: write      # 允許 workflow 寫入（commit）到 repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run fetch script
        env:
          COMMITTEE_REPORTS_SHEET_ID:  ${{ secrets.COMMITTEE_REPORTS_SHEET_ID }}
          COMMITTEE_REPORTS_SHEET_GID: ${{ secrets.COMMITTEE_REPORTS_SHEET_GID }}
        run: node scripts/fetchCommitteeReports.mjs

      - name: Check for changes
        id: diff
        run: |
          # 檢查檔案是否已存在於 git 紀錄中
          if git ls-files --error-unmatch data/committeeReports.json > /dev/null 2>&1; then
            # 取出前一版的 JSON 並剔除 cachedAt 欄位
            git show HEAD:data/committeeReports.json | jq -S 'walk(if type == "object" then del(.cachedAt) else . end)' > old_clean.json
            # 將新抓取的 JSON 也剔除 cachedAt 欄位
            jq -S 'walk(if type == "object" then del(.cachedAt) else . end)' data/committeeReports.json > new_clean.json
            
            # 比對兩者差異
            if cmp -s old_clean.json new_clean.json; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            # 如果是第一次建立此檔案，必定有變更
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 判斷觸發原因
        id: reason
        # 外部輸入一律經由 env 傳入，不直接以 GitHub 運算式展開於 shell 中，避免指令注入
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REASON: ${{ github.event.inputs.reason }}
          TRIGGERED_BY: ${{ github.event.client_payload.triggered_by }}
          TRIGGERED_BY_SITE: ${{ github.event.client_payload.triggered_by_site }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            MSG="每週自動執行"
          elif [ "$EVENT_NAME" = "repository_dispatch" ]; then
            # triggered_by 由網站後台帶入，內容為登入單位簡稱或「管理員（暱稱）」
            if [ -n "$TRIGGERED_BY" ]; then
              MSG="由「${TRIGGERED_BY}」透過「${TRIGGERED_BY_SITE:-未知網站}」的 API 觸發"
            else
              MSG="透過 API 觸發（未註明觸發者）"
            fi
          elif [ -n "$INPUT_REASON" ]; then
            MSG="使用者從介面手動更新，事由：「${INPUT_REASON}」"
          else
            MSG="使用者從介面手動更新"
          fi
          # 去除換行，避免破壞 GITHUB_OUTPUT 的格式
          MSG=$(printf '%s' "$MSG" | tr -d '\r\n')
          printf 'msg=%s\n' "$MSG" >> "$GITHUB_OUTPUT"

      - name: Commit and push if changed
        if: steps.diff.outputs.changed == 'true'
        env:
          REASON_MSG: ${{ steps.reason.outputs.msg }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/committeeReports.json
          git commit -m "data(committee-reports): 從 Google Sheets 同步委員會建議事項資料" -m "觸發原因：${REASON_MSG}"
          git push

      - name: 清除 jsDelivr 快取
        if: steps.diff.outputs.changed == 'true'
        run: |
          curl https://purge.jsdelivr.net/gh/ntpusu/legislative-data@main/data/committeeReports.json

      - name: No changes detected
        if: steps.diff.outputs.changed == 'false'
        run: echo "試算表資料（排除 cachedAt 後）與現有檔案相同，不予 commit。"